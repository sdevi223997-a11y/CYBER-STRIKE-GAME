<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VIVEK'S CYBER STRIKE 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background: #020617; font-family: Arial, sans-serif; }
        #hud {
            position: absolute; top: 15px; left: 20px; color: #00f3ff;
            font-size: 20px; font-weight: bold; text-shadow: 0 0 10px #00f3ff;
            pointer-events: none;
        }
        #help {
            position: absolute; bottom: 15px; width: 100%; text-align: center;
            color: #94a3b8; font-size: 14px; pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="hud">🎯 SCORE: <span id="score">0</span> | ❤️ HP: <span id="hp">100</span>%</div>
    <div id="help">🎮 <b>Left / Right Arrow (या A / D)</b> से मुड़ें | <b>Spacebar</b> से 3D लेज़र चलाएं!</div>

    <script src="https://cloudflare.com"></script>
    <script>
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020617, 0.035);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 9);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 3D Cyber Grid Floor
        const grid = new THREE.GridHelper(60, 40, 0x00f3ff, 0x1e293b);
        grid.position.y = -1;
        scene.add(grid);

        // Player 3D Jet
        const shipGeo = new THREE.ConeGeometry(0.7, 2, 4);
        shipGeo.rotateX(-Math.PI / 2);
        const shipMat = new THREE.MeshBasicMaterial({ color: 0x00f3ff, wireframe: false });
        const ship = new THREE.Mesh(shipGeo, shipMat);
        ship.position.set(0, 0, 4);
        scene.add(ship);

        let score = 0, hp = 100, gameOver = false;
        const lasers = [], enemies = [], keys = {};

        window.addEventListener("keydown", e => {
            keys[e.code] = true;
            if (e.code === "Space" && !gameOver) shoot();
            if (e.code === "KeyR" && gameOver) location.reload();
        });
        window.addEventListener("keyup", e => keys[e.code] = false);

        function shoot() {
            const geo = new THREE.BoxGeometry(0.15, 0.15, 1.2);
            const mat = new THREE.MeshBasicMaterial({ color: 0xfde047 });
            const laser = new THREE.Mesh(geo, mat);
            laser.position.set(ship.position.x, 0, ship.position.z - 1);
            scene.add(laser);
            lasers.push(laser);
        }

        setInterval(() => {
            if (gameOver) return;
            const geo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
            const mat = new THREE.MeshBasicMaterial({ color: 0xff2a5f, wireframe: true });
            const enemy = new THREE.Mesh(geo, mat);
            enemy.position.set((Math.random() - 0.5) * 14, 0, -35);
            scene.add(enemy);
            enemies.push(enemy);
        }, 800);

        function animate() {
            requestAnimationFrame(animate);
            if (gameOver) return;

            grid.position.z = (grid.position.z + 0.25) % 1.5;

            if ((keys["ArrowLeft"] || keys["KeyA"]) && ship.position.x > -7) ship.position.x -= 0.22;
            if ((keys["ArrowRight"] || keys["KeyD"]) && ship.position.x < 7) ship.position.x += 0.22;

            lasers.forEach((l, li) => {
                l.position.z -= 0.9;
                if (l.position.z < -45) { scene.remove(l); lasers.splice(li, 1); }
            });

            enemies.forEach((en, ei) => {
                en.position.z += 0.35;
                en.rotation.x += 0.04; en.rotation.y += 0.04;

                if (en.position.distanceTo(ship.position) < 1.3) {
                    hp -= 25; document.getElementById("hp").textContent = hp;
                    scene.remove(en); enemies.splice(ei, 1);
                    if (hp <= 0) {
                        gameOver = true;
                        document.getElementById("hud").innerHTML = `💀 GAME OVER! SCORE: ${score} (Press <b>R</b> to Restart)`;
                    }
                }

                lasers.forEach((l, li) => {
                    if (en.position.distanceTo(l.position) < 1.2) {
                        score += 10; document.getElementById("score").textContent = score;
                        scene.remove(en); enemies.splice(ei, 1);
                        scene.remove(l); lasers.splice(li, 1);
                    }
                });
            });

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
